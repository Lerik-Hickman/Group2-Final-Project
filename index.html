<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group 2 Interactive Story</title>

    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- USER INPUT - KRISTINA-->
    <div id="welcome-overlay">
        <h2>Welcome, Adventurer!</h2>

        <p>Enter the names of your characters to begin.</p>

        <label for="character-name">Character Name:</label>
        <input type="text" id="character-name" maxlength="20" autocomplete="off">

        <label for="princess-name">Princess Name:</label>
        <input type="text" id="princess-name" maxlength="20" autocomplete="off">

        <label for="wizard-name">Wizard Name:</label>
        <input type="text" id="wizard-name" maxlength="20" autocomplete="off">

        <p id="name-error" role="alert"></p>

        <button id="begin-adventure" type="button">Begin Adventure</button>
    </div>
    <!-- END USER INPUT-->

    </div>

    <!-- Game Title -->
    <header>
        <h1>Story Title</h1>
    </header>

    <!-- Main Game Layout -->
    <main id="game-container">

        <!-- Left Side: History Log -->
        <aside id="history-panel">

            <h2>History</h2>

            <button id="toggle-history" type="button">
                Toggle History
            </button>

            <div id="history-log">
                <!-- Story history appears here -->
            </div>

        </aside>

        <!-- Center: Story Content -->
        <section id="story-panel">

            <!-- Story Image -->
            <div id="image-container">

                 <!-- Background layer -->
                <img id="story-image" src="images/hut-background.png" alt="Interior of Boblin's hut">

                <!-- Foreground layer -->
                <img id="boblin" src="images/boblin.png" alt="Boblin welcoming the adventurer">

                <!-- Door layer -->
                <img id="hut-door" src="images/door.png" alt="">

            </div>

            <!-- Story Text -->
            <div id="story-text">

                <p id="paragraph1"></p>

                <p id="paragraph2"></p>

                <p id="paragraph3"></p>

            </div>

            <!-- STORY PROGRESS BAR - KRISTINA -->
            <div id="progress-container">
                <label for="story-progress">Adventure Progress</label>
                <progress id="story-progress" value="1" max="7"></progress>
                <span id="progress-fraction">1/7</span>
            </div>

            <p id="progress-message"></p>


            <!-- END STORY PROGRESS BAR -->

            <!-- Quick Time Event -->
            <div id="qte-container" hidden>

                <p>Time Remaining:</p>

                <span id="qte-timer">0</span>

            </div>

            <!-- Story Choices -->
            <div id="choices">

                <button id="choice-one" type="button">
                    Option 1
                </button>

                <button id="choice-two" type="button">
                    Option 2
                </button>

            </div>

        </section>

        <!-- Right Side: Inventory, Achievements, Alerts -->
        <aside id="right-sidebar">

            <!-- Inventory -->
            <section id="inventory-panel">

                <h2>Inventory</h2>

                <div id="inventory-list">
                    <!-- Collected items appear here -->
                </div>

            </section>

            <!-- Achievements -->
            <section id="achievements-panel">

                <h2>Achievements</h2>

                <div id="achievement-list">
                    <!-- Unlocked achievements appear here -->
                </div>

            </section>

            <!-- Alerts and Notifications -->
            <section id="alerts-panel">

                <h2>Alerts</h2>

                <div id="alerts-list">
                    <!-- Item notifications and other alerts appear here -->
                </div>

            </section>

        </aside>

    </main>

</body>

</html>
